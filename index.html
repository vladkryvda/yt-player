<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>•</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* СУВОРИЙ ЗАБОРОН КУРСОРУ */
*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  cursor: none !important; 
  -webkit-user-select: none;
  user-select: none;
}

input, textarea {
  user-select: text !important;
  -webkit-user-select: text !important;
  cursor: none !important;
}

*:active {
  cursor: none !important;
}

:root { --ease: cubic-bezier(.4,0,.2,1); }

[data-theme="dark"] {
  --bg:          #000000;
  --line:        rgba(255,255,255,0.13);
  --text:        rgba(210,210,210,0.9);
  --inp-text:    rgba(210,210,210,0.9);
  --muted:       rgba(210,210,210,0.35);
  --placeholder: rgba(210,210,210,0.25);
  --faint:       rgba(210,210,210,0.38);
  --ok:          #6aab7e;
  --err:         #b85c5c;
  --corner:      rgba(255,255,255,0.13);
  --cursor-bg:   rgba(210,210,210,0.9);
}

[data-theme="light"] {
  --bg:          #87CEEB;
  --line:        rgba(26, 43, 60, 0.1);
  --text:        #1a2b3c; 
  --inp-text:    #0a1a2a; 
  --muted:       rgba(26, 43, 60, 0.5);
  --placeholder: rgba(26, 43, 60, 0.35);
  --faint:       rgba(26, 43, 60, 0.4);
  --ok:          #2d5a3c;
  --err:         #a63d3d;
  --corner:      rgba(26, 43, 60, 0.2);
  --cursor-bg:   #1a2b3c;
}

#bg-canvas { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  pointer-events: none; 
  z-index: 0; 
  transform: translateZ(0); /* Апаратне прискорення GPU */
}

#cur {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--cursor-bg); position: fixed;
  top: 0; left: 0;
  pointer-events: none; z-index: 9999;
  opacity: 0;
  will-change: transform;
  transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
  transition: width .18s var(--ease), height .18s var(--ease), background .35s, opacity .15s ease;
}
#cur.hover { width: 13px; height: 13px; }

html { 
  height: 100%; 
  background: var(--bg); 
  transition: background 0.8s var(--ease); 
  overflow: hidden;
}

body {
  height: 100%; 
  overflow: hidden;
  font-family: 'Geist', sans-serif;
  color: var(--text); 
  display: flex; 
  flex-direction: column;
  transition: color .35s var(--ease);
}

.top-bar { position: fixed; top: 18px; right: 24px; z-index: 50; }
.theme-btn {
  width: 32px; height: 32px; border: none; background: none;
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  transition: color .2s; position: relative;
}
.theme-btn:hover { color: var(--text); }
.theme-btn svg {
  width: 14px; height: 14px; position: absolute;
  transition: opacity .2s, transform .2s var(--ease);
}
.icon-moon { opacity: 1; transform: rotate(0deg); }
.icon-sun  { opacity: 0; transform: rotate(-45deg); }
[data-theme="light"] .icon-moon { opacity: 0; transform: rotate(45deg); }
[data-theme="light"] .icon-sun  { opacity: 1; transform: rotate(0deg); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; position: relative; z-index: 1; }
.wrap { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; animation: up .5s var(--ease) both; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

.status-row { height: 14px; display: flex; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; transition: background .2s; }
.dot.ok { background: var(--ok); }
.dot.err { background: var(--err); }

.inp-area { position: relative; }
.inp-area::before {
  content: ''; position: absolute; left: 0; bottom: 0; width: 12px; height: 12px;
  border-left: 1px solid var(--corner); border-bottom: 1px solid var(--corner);
  border-bottom-left-radius: 4px; pointer-events: none; transition: border-color .35s;
}

input {
  width: 100%; height: 44px; background: transparent; border: none;
  padding: 0 48px 8px 16px; font-family: 'Geist Mono', monospace;
  font-size: 14px; font-weight: 300; color: var(--inp-text);
  outline: none; letter-spacing: .02em; transition: color .35s;
}
input::placeholder { color: var(--placeholder); }

#clr {
  position: absolute; right: 0; top: 50%; transform: translateY(-60%);
  background: none; border: none; color: var(--muted);
  display: none; align-items: center; justify-content: center; width: 36px; height: 36px;
  z-index: 5;
}
#clr.on { display: flex; }
#clr:hover { color: var(--text); }
#clr svg { width: 9px; height: 9px; }

.player-outer { position: relative; width: 100%; aspect-ratio: 16/9; }
.player-outer::before { content: ''; position: absolute; top: 0; right: 0; width: 16px; height: 16px; border-top: 1px solid var(--corner); border-right: 1px solid var(--corner); border-top-right-radius: 4px; z-index: 3; transition: border-color .35s; pointer-events: none; }
.player-outer::after { content: ''; position: absolute; bottom: 0; left: 0; width: 16px; height: 16px; border-bottom: 1px solid var(--corner); border-left: 1px solid var(--corner); border-bottom-left-radius: 4px; z-index: 3; transition: border-color .35s; pointer-events: none; }
.player { width: 100%; height: 100%; background: #00000010; border-radius: 4px; overflow: hidden; position: relative; }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 1; transition: opacity .25s; pointer-events: none; }
.ph.gone { opacity: 0; }
.ph p { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.ph svg { width: 20px; height: 20px; color: var(--faint); opacity: 0.5; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; opacity: 0; transition: opacity .3s; z-index: 2; }
iframe.on { opacity: 1; }

.quick-notes {
  width: 100%;
  height: 60px;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: 'Geist Mono', monospace;
  font-size: 13px;
  font-weight: 300;
  color: var(--inp-text);
  padding: 8px 16px;
  line-height: 1.5;
  letter-spacing: .02em;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.quick-notes::-webkit-scrollbar { display: none; }
.quick-notes::placeholder { color: var(--placeholder); }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="cur"></div>

<div class="top-bar">
  <button class="theme-btn" id="themeBtn" title="Змінити тему">
    <svg class="icon-moon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 9.5A5.5 5.5 0 0 1 4.5 2a5.5 5.5 0 1 0 7.5 7.5z"/></svg>
    <svg class="icon-sun" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="2.5"/><path d="M7 .5V2M7 12v1.5M.5 7H2M12 7h1.5M2.8 2.8l1 1M10.2 10.2l1 1M11.2 2.8l-1 1M3.8 10.2l-1 1"/></svg>
  </button>
</div>

<main>
  <div class="wrap">
    <div class="status-row"><div class="dot" id="dot"></div></div>
    <div class="inp-area">
      <input id="inp" type="text" placeholder="вставте посилання на YouTube відео" autocomplete="off" spellcheck="false">
      <button id="clr" title="Очистити">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
      </button>
    </div>
    
    <div class="player-outer" id="playerOuter">
      <div class="player">
        <div class="ph" id="ph">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="3" width="18" height="14" rx="2"/><polygon points="8,7 14,10 8,13" fill="currentColor" stroke="none"/></svg>
          <p>очікую посилання</p>
        </div>
        <iframe id="frame" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe>
      </div>
    </div>

    <textarea id="notes" class="quick-notes" placeholder="швидкі нотатки тут..." autocomplete="off" spellcheck="false"></textarea>
  </div>
</main>

<script>
  function safeSave(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  // Кешований текстурний канвас для хмар
  const cloudCanvas = document.createElement('canvas');
  cloudCanvas.width = 128;
  cloudCanvas.height = 128;
  const cloudCtx = cloudCanvas.getContext('2d');
  const cloudGrad = cloudCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
  cloudGrad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
  cloudGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.3)');
  cloudGrad.addColorStop(0.8, 'rgba(255, 255, 255, 0)');
  cloudCtx.fillStyle = cloudGrad;
  cloudCtx.beginPath();
  cloudCtx.arc(64, 64, 64, 0, Math.PI * 2);
  cloudCtx.fill();

  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  let stars = [], clouds = [];
  let globalAlpha = 0;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Star {
    constructor() { this.init(true); }
    init(randomAlpha = false) {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() > 0.8 ? 2 : 1; // 1-2 пікселі
      this.maxAlpha = Math.random() * 0.7 + 0.3;
      this.alpha = randomAlpha ? Math.random() * this.maxAlpha : 0;
      this.speed = Math.random() * 0.02 + 0.01;
    }
    update() {
      this.alpha += this.speed;
      if (this.alpha >= this.maxAlpha) {
        this.alpha = this.maxAlpha;
        this.speed = -Math.abs(this.speed);
      } else if (this.alpha <= 0) {
        this.alpha = 0;
        this.speed = Math.abs(this.speed);
      }
    }
    draw() {
      const a = this.alpha * globalAlpha;
      if (a <= 0.03) return;
      ctx.globalAlpha = a;
      // fillRect набагато швидший за arc() і не навантажує процесор
      ctx.fillRect(this.x, this.y, this.size, this.size);
    }
  }

  class Cloud {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.r = Math.random() * 100 + 150; 
      this.speed = Math.random() * 0.3 + 0.1;
    }
    update() {
      this.x += this.speed;
      if (this.x - this.r > canvas.width) {
        this.x = -this.r;
        this.y = Math.random() * canvas.height;
      }
    }
    draw() {
      ctx.globalAlpha = globalAlpha * 0.85;
      ctx.drawImage(cloudCanvas, this.x - this.r, this.y - this.r, this.r * 2, this.r * 2);
    }
  }

  for (let i = 0; i < 90; i++) stars.push(new Star());
  for (let i = 0; i < 5; i++) clouds.push(new Cloud());

  // Обмежувач частоти кадрів (30 FPS) — зберігає холодний процесор
  let lastFrameTime = 0;
  const targetFPS = 30;
  const frameInterval = 1000 / targetFPS;

  function animate(currentTime) {
    requestAnimationFrame(animate);

    // Зупиняємо розрахунки, якщо вкладку згорнуто
    if (document.hidden) return;

    const elapsed = currentTime - lastFrameTime;
    if (elapsed < frameInterval) return;
    lastFrameTime = currentTime - (elapsed % frameInterval);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const theme = document.documentElement.getAttribute('data-theme');
    if (globalAlpha < 1) globalAlpha = Math.min(1, globalAlpha + 0.05);

    if (theme === 'dark') {
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < stars.length; i++) {
        stars[i].update();
        stars[i].draw();
      }
    } else {
      for (let i = 0; i < clouds.length; i++) {
        clouds[i].update();
        clouds[i].draw();
      }
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(animate);

  // Курсор з апаратним прискоренням
  const curEl = document.getElementById('cur');
  window.addEventListener('mousemove', (e) => {
    curEl.style.opacity = '1';
    curEl.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
  }, { passive: true });

  document.addEventListener('mouseleave', () => { curEl.style.opacity = '0'; });
  document.addEventListener('mouseenter', () => { curEl.style.opacity = '1'; });

  const playerOuter = document.getElementById('playerOuter');
  playerOuter.addEventListener('mouseenter', () => {
    if (frame.classList.contains('on')) curEl.style.opacity = '0';
  });
  playerOuter.addEventListener('mouseleave', () => {
    curEl.style.opacity = '1';
  });

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('button, input, textarea, a')) {
      curEl.classList.add('hover');
    }
  }, { passive: true });

  document.addEventListener('mouseout', (e) => {
    if (e.target.closest('button, input, textarea, a')) {
      const rel = e.relatedTarget;
      if (!rel || !rel.closest('button, input, textarea, a')) {
        curEl.classList.remove('hover');
      }
    }
  }, { passive: true });

  function toggleTheme() {
    globalAlpha = 0;
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    safeSave('yt-theme', next);
  }

  document.getElementById('themeBtn').onclick = (e) => { 
    e.stopPropagation(); 
    toggleTheme(); 
  };
  
  document.onclick = (e) => { 
    if (!e.target.closest('input, textarea, button, #playerOuter')) {
      toggleTheme(); 
    }
  };

  const inp = document.getElementById('inp');
  const dot = document.getElementById('dot');
  const clr = document.getElementById('clr');
  const frame = document.getElementById('frame');
  const ph = document.getElementById('ph');
  const notes = document.getElementById('notes');

  let currentVideoId = null;

  function extractVideoId(v) {
    if (!v) return null;
    const str = v.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
    const m = str.match(/(?:[?&]v=|youtu\.be\/|\/(?:shorts|embed|live)\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function setVideo(id) {
    if (currentVideoId === id) return;
    currentVideoId = id;

    dot.className = 'dot ok'; 
    ph.classList.add('gone'); 
    frame.classList.add('on');
    frame.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1&rel=0`;
  }

  function clearVideo() {
    currentVideoId = null;
    frame.src = '';
    frame.classList.remove('on');
    ph.classList.remove('gone');
  }

  let saveLinkTimer = null;
  inp.oninput = () => {
    const v = inp.value; 
    clearTimeout(saveLinkTimer);
    saveLinkTimer = setTimeout(() => safeSave('yt-saved-link', v), 400);

    clr.classList.toggle('on', v.length > 0);
    const id = extractVideoId(v);

    if (id) {
      setVideo(id);
    } else {
      dot.className = v.trim() ? 'dot err' : 'dot';
      if (!v.trim()) { 
        clearVideo();
      }
    }
  };

  function resetInput() {
    inp.value = '';
    clearTimeout(saveLinkTimer);
    safeSave('yt-saved-link', '');
    clr.classList.remove('on');
    clearVideo();
    dot.className = 'dot';
    inp.focus();
  }

  clr.onclick = (e) => { 
    e.stopPropagation(); 
    resetInput();
  };

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') resetInput();
  });

  let notesTimer = null;
  notes.oninput = () => {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => {
      safeSave('yt-saved-notes', notes.value);
    }, 500);
  };

  (function init() {
    const saved = safeGet('yt-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);

    const savedNotes = safeGet('yt-saved-notes');
    if (savedNotes) {
      notes.value = savedNotes;
    }

    const savedLink = safeGet('yt-saved-link');
    if (savedLink) {
      inp.value = savedLink;
      inp.oninput();
    }

    inp.focus();
  })();
</script>
</body>
</html>
