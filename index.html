<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* Japanese Washi (Unbleached Paper) */
  --bg: #f4f1ea;
  --surface: #f9f7f2;
  --border: #e3ded5;
  --corner: #38342e;
  --text: #322e29;
  --faint: #a69f92;
  --trans: background-color 0.18s cubic-bezier(0.16, 1, 0.3, 1),
           border-color 0.18s cubic-bezier(0.16, 1, 0.3, 1),
           color 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] {
  /* Kuro-sumi / Yakisugi (Burnt Cedar & Charcoal) */
  --bg: #131211;
  --surface: #191816;
  --border: #292724;
  --corner: #ded8ce;
  --text: #ede8df;
  --faint: #635e55;
}

html, body {
  height: 100%;
  width: 100%;
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  -webkit-font-smoothing: antialiased;
  transition: var(--trans);
  user-select: none;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
}

/* 2. Cursor hiding when idle */
body.idle, body.idle * {
  cursor: none !important;
}

/* Frame Container */
.player-box {
  position: relative;
  width: 100%;
  max-width: 940px;
  aspect-ratio: 16 / 9;
  background-color: var(--surface);
  border: 1px solid var(--border);
  transition: var(--trans);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 1. Thin Hairline Corner Brackets */
.corner {
  position: absolute;
  width: 8px;
  height: 8px;
  pointer-events: none;
  transition: var(--trans);
}

.corner-tl {
  top: -1px;
  left: -1px;
  border-top: 1px solid var(--corner);
  border-left: 1px solid var(--corner);
}

.corner-tr {
  top: -1px;
  right: -1px;
  border-top: 1px solid var(--corner);
  border-right: 1px solid var(--corner);
}

.corner-bl {
  bottom: -1px;
  left: -1px;
  border-bottom: 1px solid var(--corner);
  border-left: 1px solid var(--corner);
}

.corner-br {
  bottom: -1px;
  right: -1px;
  border-bottom: 1px solid var(--corner);
  border-right: 1px solid var(--corner);
}

/* Quiet prompt when empty */
.cue {
  color: var(--faint);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  pointer-events: none;
  transition: opacity 0.2s ease, var(--trans);
}

.cue.hidden {
  opacity: 0;
}

/* Pure Player Frame */
iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

iframe.active {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>
<body>

<div class="player-box" id="playerBox">
  <!-- Minimalist Corner Reticles -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Subtle placeholder -->
  <div class="cue" id="cue">[ ⌘v ]</div>

  <iframe id="video" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen></iframe>
</div>

<script>
  const html = document.documentElement;
  const video = document.getElementById('video');
  const cue = document.getElementById('cue');

  let hasVideo = false;
  let idleTimer = null;

  // 1. Theme toggle on click anywhere (synchronized)
  function toggleTheme() {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    try { localStorage.setItem('player-theme', next); } catch(e) {}
  }

  window.addEventListener('click', () => {
    toggleTheme();
  });

  // 2. Hide cursor on 2s inactivity
  function wakeCursor() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      document.body.classList.add('idle');
    }, 2000);
  }

  window.addEventListener('mousemove', wakeCursor);
  window.addEventListener('keydown', wakeCursor);
  wakeCursor();

  // 3. YouTube link parsing
  function extractId(url) {
    if (!url) return null;
    const match = url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : (/^[a-zA-Z0-9_-]{11}$/.test(url.trim()) ? url.trim() : null);
  }

  function extractStart(url) {
    const match = url.match(/[?&#](?:t|start)=([0-9hms]+)/i);
    if (!match) return 0;
    const t = match[1];
    if (/^\d+$/.test(t)) return parseInt(t, 10);
    let sec = 0;
    const h = t.match(/(\d+)h/i), m = t.match(/(\d+)m/i), s = t.match(/(\d+)s/i);
    if (h) sec += parseInt(h[1]) * 3600;
    if (m) sec += parseInt(m[1]) * 60;
    if (s) sec += parseInt(s[1]);
    return sec;
  }

  function play(id, time) {
    hasVideo = true;
    cue.classList.add('hidden');
    video.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0${time ? `&start=${time}` : ''}`;
    video.classList.add('active');
  }

  function clearVideo() {
    if (!hasVideo) return;
    hasVideo = false;
    video.src = '';
    video.classList.remove('active');
    cue.classList.remove('hidden');
  }

  // 4. Keyboard shortcuts
  window.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const id = extractId(text);
    if (id) {
      play(id, extractStart(text));
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'Delete') {
      clearVideo();
    }
  });

  // Restore saved theme
  (function init() {
    try {
      const saved = localStorage.getItem('player-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      html.setAttribute('data-theme', saved);
    } catch(e) {}
  })();
</script>
</body>
</html>
