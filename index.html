<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* Japanese Washi (Unbleached Paper) */
  --bg: #f4f1ea;
  --surface: #f9f7f2;
  --border: #dfd9ce;
  --corner: #8c8578;
  --text: #322e29;
  --faint: #aba394;
}

[data-theme="dark"] {
  /* Kuro-sumi / Yakisugi (Burnt Cedar & Charcoal) */
  --bg: #131211;
  --surface: #181715;
  --border: #262421;
  --corner: #6e685f;
  --text: #ede8df;
  --faint: #635e55;
}

/* Synchronized smooth transition without flash */
html, body, .player-box, .corner, .cue {
  transition: background-color 0.15s ease,
              border-color 0.15s ease,
              color 0.15s ease;
}

html, body {
  height: 100%;
  width: 100%;
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* Auto-hide cursor on idle */
body.idle, body.idle * {
  cursor: none !important;
}

/* Player Frame */
.player-box {
  position: relative;
  width: 100%;
  max-width: 940px;
  aspect-ratio: 16 / 9;
  background-color: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Dynamic Collapse during playback */
.player-box.playing {
  border-color: transparent;
  background-color: transparent;
}

/* Hairline Corner Reticles */
.corner {
  position: absolute;
  width: 8px;
  height: 8px;
  pointer-events: none;
  transition: background-color 0.15s ease,
              border-color 0.15s ease,
              opacity 0.25s ease,
              transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}

.player-box.playing .corner {
  opacity: 0;
}

.corner-tl {
  top: -1px;
  left: -1px;
  border-top: 1px solid var(--corner);
  border-left: 1px solid var(--corner);
}

.corner-tr {
  top: -1px;
  right: -1px;
  border-top: 1px solid var(--corner);
  border-right: 1px solid var(--corner);
}

.corner-bl {
  bottom: -1px;
  left: -1px;
  border-bottom: 1px solid var(--corner);
  border-left: 1px solid var(--corner);
}

.corner-br {
  bottom: -1px;
  right: -1px;
  border-bottom: 1px solid var(--corner);
  border-right: 1px solid var(--corner);
}

/* Shutter pulse on ⌘V / ⌘Z */
.pulsing .corner-tl { transform: translate(-3px, -3px); }
.pulsing .corner-tr { transform: translate(3px, -3px); }
.pulsing .corner-bl { transform: translate(-3px, 3px); }
.pulsing .corner-br { transform: translate(3px, 3px); }

/* Minimal Cue */
.cue {
  color: var(--faint);
  font-size: 11px;
  letter-spacing: 0.12em;
  pointer-events: none;
}

.cue.hidden {
  opacity: 0;
}

/* Video Frame */
iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

iframe.active {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>
<body>

<div class="player-box" id="playerBox">
  <!-- Corner Reticles -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Quiet Cue -->
  <div class="cue" id="cue">⌘V</div>

  <iframe id="video" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen></iframe>
</div>

<script>
  const html = document.documentElement;
  const playerBox = document.getElementById('playerBox');
  const video = document.getElementById('video');
  const cue = document.getElementById('cue');

  let hasVideo = false;
  let currentVideo = null;
  let lastClearedVideo = null;
  let idleTimer = null;

  // 1. Dynamic Scale (Trackpad & Scroll)
  let currentWidth = 940;
  const minWidth = 440;

  function updateScale(delta) {
    const maxWidth = Math.min(1600, window.innerWidth * 0.94);
    currentWidth = Math.max(minWidth, Math.min(maxWidth, currentWidth + delta));
    playerBox.style.maxWidth = `${Math.round(currentWidth)}px`;
  }

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const sensitivity = e.ctrlKey ? 2.5 : 0.8;
    const delta = -e.deltaY * sensitivity;
    updateScale(delta);
  }, { passive: false });

  // 2. Synchronous Theme Toggle on Background Click
  window.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
  });

  // 3. Hide Cursor on 2s Inactivity
  function wakeCursor() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      document.body.classList.add('idle');
    }, 2000);
  }

  window.addEventListener('mousemove', wakeCursor);
  window.addEventListener('keydown', wakeCursor);
  wakeCursor();

  // 4. Link & Timestamp Parsing
  function extractId(url) {
    if (!url) return null;
    const match = url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : (/^[a-zA-Z0-9_-]{11}$/.test(url.trim()) ? url.trim() : null);
  }

  function extractStart(url) {
    const match = url.match(/[?&#](?:t|start)=([0-9hms]+)/i);
    if (!match) return 0;
    const t = match[1];
    if (/^\d+$/.test(t)) return parseInt(t, 10);
    let sec = 0;
    const h = t.match(/(\d+)h/i), m = t.match(/(\d+)m/i), s = t.match(/(\d+)s/i);
    if (h) sec += parseInt(h[1]) * 3600;
    if (m) sec += parseInt(m[1]) * 60;
    if (s) sec += parseInt(s[1]);
    return sec;
  }

  function play(id, time) {
    hasVideo = true;
    currentVideo = { id, time };
    cue.classList.add('hidden');
    // rel=1 displays recommendations across YouTube, not just from the current channel
    video.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=1${time ? `&start=${time}` : ''}`;
    video.classList.add('active');
    playerBox.classList.add('playing');
  }

  function clearVideo() {
    if (!hasVideo) return;
    lastClearedVideo = { ...currentVideo }; // Remember cleared video for ⌘Z
    hasVideo = false;
    currentVideo = null;
    video.src = '';
    video.classList.remove('active');
    playerBox.classList.remove('playing');
    cue.classList.remove('hidden');
  }

  function triggerPulse() {
    playerBox.classList.add('pulsing');
    setTimeout(() => playerBox.classList.remove('pulsing'), 160);
  }

  // 5. Paste: ⌘V / Ctrl+V
  window.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const id = extractId(text);
    if (id) {
      triggerPulse();
      play(id, extractStart(text));
    }
  });

  // 6. Keyboard Controls: Esc/Backspace (Clear) & ⌘Z (Undo)
  window.addEventListener('keydown', (e) => {
    const isCmdOrCtrl = e.metaKey || e.ctrlKey;

    // Undo: ⌘Z or Ctrl+Z
    if (isCmdOrCtrl && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      if (!hasVideo && lastClearedVideo) {
        e.preventDefault();
        triggerPulse();
        play(lastClearedVideo.id, lastClearedVideo.time);
      }
      return;
    }

    // Clear: Esc or Backspace
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'Delete') {
      clearVideo();
    }
  });

  // System Theme init (Zero storage)
  (function init() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    updateScale(0);
  })();
</script>
</body>
</html>
