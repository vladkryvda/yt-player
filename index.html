<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* Japanese Washi (Light) */
  --bg: #f4f1ea;
  --text: #2b2824;
  --faint: #8f887b;
  --video-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.16);
  --radius-video: 18px;
}

[data-theme="dark"] {
  /* Kuro-sumi / Yakisugi Charcoal (Dark) */
  --bg: #111110;
  --text: #ede8df;
  --faint: #6b6459;
  --video-shadow: 0 28px 70px -14px rgba(0, 0, 0, 0.75);
  --radius-video: 18px;
}

html, body {
  height: 100%;
  width: 100%;
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  transition: background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
              color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

body.idle, body.idle * {
  cursor: none !important;
}

/* Micro-Texture Film Grain */
.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* Video Scalable Box */
.player-box {
  position: relative;
  width: 100%;
  max-width: 940px;
  aspect-ratio: 16 / 9;
  display: flex;
  align-items: center;
  justify-content: center;
  contain: layout style;
  transform: translateZ(0);
}

/* Floating Rounded Frame for Video */
.viewport {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-video);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.97);
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
              transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow 0.3s ease;
  -webkit-mask-image: -webkit-radial-gradient(white, black);
}

.player-box.playing .viewport {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
  box-shadow: var(--video-shadow);
}

/* Minimal Living Breathing Cue */
.cue {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--faint);
  pointer-events: none;
  animation: breathe 3.6s ease-in-out infinite;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.cue.hidden {
  opacity: 0;
  transform: scale(0.9);
  animation: none;
}

@keyframes breathe {
  0%, 100% {
    opacity: 0.4;
    transform: scale(0.98);
  }
  50% {
    opacity: 0.85;
    transform: scale(1.02);
  }
}

/* Video Frame */
iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: var(--radius-video);
}
</style>
</head>
<body>

<!-- Tactile grain layer -->
<div class="grain"></div>

<div class="player-box" id="playerBox">
  <!-- Breathing Hotkey Cue Only -->
  <div class="cue" id="cue">⌘V</div>

  <!-- Rounded Floating Video Viewport -->
  <div class="viewport">
    <iframe id="video" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen></iframe>
  </div>
</div>

<script>
  const html = document.documentElement;
  const playerBox = document.getElementById('playerBox');
  const video = document.getElementById('video');
  const cue = document.getElementById('cue');

  let hasVideo = false;
  let currentVideo = null;
  let lastClearedVideo = null;
  let idleTimer = null;
  let isIdle = false;

  // 1. Direct 1:1 Responsive Scaling (Zero Inertia, Instant Tracking)
  let currentWidth = 940;
  const minWidth = 440;
  let scaleRaf = null;

  function applyScale() {
    playerBox.style.maxWidth = `${Math.round(currentWidth)}px`;
    scaleRaf = null;
  }

  window.addEventListener('wheel', (e) => {
    if (hasVideo && playerBox.matches(':hover')) {
      return;
    }
    e.preventDefault();

    // Direct 1:1 input with zero friction / zero inertia
    const sensitivity = e.ctrlKey ? 2.0 : 0.9;
    const delta = -e.deltaY * sensitivity;
    const maxWidth = Math.min(1600, window.innerWidth * 0.94);

    currentWidth = Math.max(minWidth, Math.min(maxWidth, currentWidth + delta));

    if (!scaleRaf) {
      scaleRaf = requestAnimationFrame(applyScale);
    }
  }, { passive: false });

  // 2. Prevent selection on double-click & Toggle Theme
  window.addEventListener('mousedown', (e) => {
    if (e.detail > 1) {
      e.preventDefault();
    }
  });

  window.addEventListener('dblclick', (e) => {
    if (e.target.tagName !== 'IFRAME') {
      const selection = window.getSelection();
      if (selection) selection.removeAllRanges();
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
    }
  });

  // 3. Keep Window Focused for Instant Commands (No Clicking Needed)
  function reclaimFocus() {
    if (document.activeElement === video || document.activeElement !== document.body) {
      window.focus();
    }
  }

  window.addEventListener('focus', reclaimFocus);
  window.addEventListener('mouseenter', reclaimFocus);
  window.addEventListener('mousemove', () => {
    wakeCursor();
    if (!playerBox.matches(':hover') && document.activeElement === video) {
      window.focus();
    }
  }, { passive: true });

  // 4. Cursor Inactivity
  function wakeCursor() {
    if (isIdle) {
      isIdle = false;
      document.body.classList.remove('idle');
    }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      isIdle = true;
      document.body.classList.add('idle');
    }, 2000);
  }

  window.addEventListener('keydown', wakeCursor, { passive: true });
  wakeCursor();

  // 5. Link & Timestamp Parsing
  function extractId(url) {
    if (!url || typeof url !== 'string') return null;
    const match = url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|live\/))([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : (/^[a-zA-Z0-9_-]{11}$/.test(url.trim()) ? url.trim() : null);
  }

  function extractStart(url) {
    if (!url || typeof url !== 'string') return 0;
    const match = url.match(/[?&#](?:t|start)=([0-9hms]+)/i);
    if (!match) return 0;
    const t = match[1];
    if (/^\d+$/.test(t)) return parseInt(t, 10);
    let sec = 0;
    const h = t.match(/(\d+)h/i), m = t.match(/(\d+)m/i), s = t.match(/(\d+)s/i);
    if (h) sec += parseInt(h[1]) * 3600;
    if (m) sec += parseInt(m[1]) * 60;
    if (s) sec += parseInt(s[1]);
    return sec;
  }

  // 6. Playback Controller
  function play(id, time = 0) {
    hasVideo = true;
    currentVideo = { id, time };
    cue.classList.add('hidden');

    const timeParam = time ? `&start=${time}` : '';
    video.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=1${timeParam}`;

    playerBox.classList.add('playing');
    window.focus();
  }

  function clearVideo() {
    if (!hasVideo) return;
    lastClearedVideo = { ...currentVideo };
    hasVideo = false;
    currentVideo = null;
    video.src = '';
    playerBox.classList.remove('playing');
    cue.classList.remove('hidden');
    window.focus();
  }

  // 7. Instant Paste (⌘V / Ctrl+V)
  window.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const id = extractId(text);
    if (id) {
      play(id, extractStart(text));
    }
  });

  // 8. Copy Current Video URL (⌘C / Ctrl+C)
  window.addEventListener('copy', (e) => {
    if (hasVideo && currentVideo) {
      e.preventDefault();
      const timeParam = currentVideo.time ? `?t=${currentVideo.time}` : '';
      const url = `https://youtu.be/${currentVideo.id}${timeParam}`;
      if (e.clipboardData) {
        e.clipboardData.setData('text/plain', url);
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
      }
    }
  });

  // 9. Instant Wipe (Backspace / Delete) & Undo (⌘Z)
  window.addEventListener('keydown', (e) => {
    const isCmdOrCtrl = e.metaKey || e.ctrlKey;

    if (isCmdOrCtrl && e.key.toLowerCase() === 'c') {
      if (hasVideo && currentVideo && navigator.clipboard) {
        const timeParam = currentVideo.time ? `?t=${currentVideo.time}` : '';
        navigator.clipboard.writeText(`https://youtu.be/${currentVideo.id}${timeParam}`);
      }
      return;
    }

    if (isCmdOrCtrl && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      if (!hasVideo && lastClearedVideo) {
        e.preventDefault();
        play(lastClearedVideo.id, lastClearedVideo.time);
      }
      return;
    }

    if (e.key === 'Backspace' || e.key === 'Delete') {
      clearVideo();
    }
  });

  // Init
  (function init() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    playerBox.style.maxWidth = `${currentWidth}px`;
    window.focus();
  })();
</script>
</body>
</html>
