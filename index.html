<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* iPhone X Light Liquid Watercolor */
  --bg: #f9f8f6;
  --blob-1: rgba(255, 94, 125, 0.45);  /* Coral Rose */
  --blob-2: rgba(72, 154, 255, 0.45);  /* Sky Cyan */
  --blob-3: rgba(255, 196, 68, 0.40);  /* Warm Gold */
  --text: #1d1d1f;
  --cue-color: rgba(29, 29, 31, 0.7);
  --video-shadow: 0 32px 75px -12px rgba(0, 0, 0, 0.22);
  --radius-video: 18px;
}

[data-theme="dark"] {
  /* Cinematic Theater OLED Palette */
  --bg: #060608;
  --blob-1: rgba(140, 24, 68, 0.35);   /* Deep muted wine */
  --blob-2: rgba(24, 48, 140, 0.38);   /* Midnight indigo / cobalt */
  --blob-3: rgba(110, 50, 15, 0.28);   /* Subdued warm ember */
  --text: #ededf0;
  --cue-color: rgba(237, 237, 240, 0.45);
  --video-shadow: 0 30px 90px -15px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.05);
  --radius-video: 18px;
}

html, body {
  height: 100%;
  width: 100%;
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

body.idle, body.idle * {
  cursor: none !important;
}

/* ==========================================================
   DYNAMIC AMBIENT ENGINE (CINEMATIC FOCUS)
   ========================================================== */
.aurora-container {
  position: fixed;
  inset: -15%;
  width: 130%;
  height: 130%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
  filter: blur(90px);
  opacity: 0.85;
  transform: translateZ(0);
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] .aurora-container {
  opacity: 0.32;
  filter: blur(115px);
}

body.video-active .aurora-container {
  opacity: 0.45;
}

[data-theme="dark"] body.video-active .aurora-container {
  opacity: 0.16;
}

.blob {
  position: absolute;
  border-radius: 50%;
  mix-blend-mode: screen;
  will-change: transform;
}

[data-theme="light"] .blob {
  mix-blend-mode: multiply;
}

.blob-1 {
  top: 25%;
  left: 20%;
  width: 48vw;
  height: 48vw;
  max-width: 650px;
  max-height: 650px;
  background: radial-gradient(circle, var(--blob-1) 0%, transparent 68%);
  animation: floatMorph1 22s ease-in-out infinite alternate;
}

.blob-2 {
  bottom: 20%;
  right: 18%;
  width: 52vw;
  height: 52vw;
  max-width: 700px;
  max-height: 700px;
  background: radial-gradient(circle, var(--blob-2) 0%, transparent 70%);
  animation: floatMorph2 26s ease-in-out infinite alternate;
}

.blob-3 {
  top: 40%;
  left: 45%;
  width: 44vw;
  height: 44vw;
  max-width: 600px;
  max-height: 600px;
  background: radial-gradient(circle, var(--blob-3) 0%, transparent 68%);
  animation: floatMorph3 19s ease-in-out infinite alternate;
}

@keyframes floatMorph1 {
  0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
  50% { transform: translate3d(12vw, 8vh, 0) scale(1.15) rotate(45deg); }
  100% { transform: translate3d(-8vw, 15vh, 0) scale(0.92) rotate(-30deg); }
}

@keyframes floatMorph2 {
  0% { transform: translate3d(0, 0, 0) scale(1.05) rotate(0deg); }
  50% { transform: translate3d(-14vw, -10vh, 0) scale(0.88) rotate(-60deg); }
  100% { transform: translate3d(10vw, -16vh, 0) scale(1.18) rotate(35deg); }
}

@keyframes floatMorph3 {
  0% { transform: translate3d(0, 0, 0) scale(0.95); }
  50% { transform: translate3d(-12vw, 12vh, 0) scale(1.12); }
  100% { transform: translate3d(8vw, -8vh, 0) scale(1); }
}

.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.032;
  mix-blend-mode: overlay;
  z-index: 1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* ==========================================================
   VIDEO PLAYER & VIEWPORT
   ========================================================== */
.player-box {
  position: relative;
  width: 940px;
  max-width: 94vw;
  aspect-ratio: 16 / 9;
  display: flex;
  align-items: center;
  justify-content: center;
  contain: layout style;
  transform: translateZ(0);
  z-index: 2;
}

.viewport {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-video);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.97);
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
              transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow 0.3s ease;
  -webkit-mask-image: -webkit-radial-gradient(white, black);
}

.player-box.playing .viewport {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
  box-shadow: var(--video-shadow);
}

.cue {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.16em;
  color: var(--cue-color);
  pointer-events: none;
  animation: breathe 3.6s ease-in-out infinite;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.cue.hidden {
  opacity: 0;
  transform: scale(0.9);
  animation: none;
}

@keyframes breathe {
  0%, 100% {
    opacity: 0.4;
    transform: scale(0.98);
  }
  50% {
    opacity: 0.85;
    transform: scale(1.02);
  }
}

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: var(--radius-video);
}
</style>
</head>
<body>

<div class="aurora-container">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="grain"></div>

<div class="player-box" id="playerBox">
  <div class="cue" id="cue">⌘V</div>

  <div class="viewport">
    <iframe id="video" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen></iframe>
  </div>
</div>

<script>
  const STORAGE_KEY = 'minimal_player_video_state';
  const THEME_KEY = 'minimal_player_theme';

  const html = document.documentElement;
  const playerBox = document.getElementById('playerBox');
  const video = document.getElementById('video');
  const cue = document.getElementById('cue');

  let hasVideo = false;
  let currentVideo = null;
  let lastClearedVideo = null;
  let idleTimer = null;
  let isIdle = false;

  let isPlaying = false;
  let currentTime = 0;
  let lastTimeUpdate = 0;
  let handshakeTimer = null;
  let lastSavedSecond = -1;

  // Real-time playback calculation
  function getCurrentPlaybackTime() {
    if (isPlaying && lastTimeUpdate > 0) {
      const elapsed = (performance.now() - lastTimeUpdate) / 1000;
      return currentTime + elapsed;
    }
    return currentTime;
  }

  // Storage Persistence
  function saveToStorage() {
    if (!hasVideo || !currentVideo) return;
    const curr = Math.floor(getCurrentPlaybackTime());
    if (curr === lastSavedSecond) return;
    lastSavedSecond = curr;

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        id: currentVideo.id,
        time: curr
      }));
    } catch {}
  }

  // Handshake & postMessage to YouTube IFrame
  function sendYTCommand(func, args = []) {
    if (!video.contentWindow) return;
    try {
      video.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: func,
        args: args
      }), '*');
    } catch {}
  }

  function sendListening() {
    if (!video.contentWindow) return;
    try {
      video.contentWindow.postMessage(JSON.stringify({
        event: 'listening',
        id: 1,
        channel: 'widget'
      }), '*');
    } catch {}
  }

  function startHandshake() {
    stopHandshake();
    sendListening();
    handshakeTimer = setInterval(sendListening, 250);
  }

  function stopHandshake() {
    if (handshakeTimer) {
      clearInterval(handshakeTimer);
      handshakeTimer = null;
    }
  }

  video.addEventListener('load', () => {
    if (hasVideo) startHandshake();
  });

  // Listen to messages from YouTube's iframe API
  window.addEventListener('message', (e) => {
    try {
      const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      if (!data) return;

      if (data.event === 'initialDelivery' || data.event === 'infoDelivery') {
        stopHandshake();
        if (data.info) {
          if (typeof data.info.playerState !== 'undefined') {
            isPlaying = (data.info.playerState === 1);
          }
          if (typeof data.info.currentTime === 'number') {
            currentTime = data.info.currentTime;
            lastTimeUpdate = performance.now();
            saveToStorage();
          }
        }
      } else if (data.event === 'onStateChange') {
        if (typeof data.info === 'number') {
          isPlaying = (data.info === 1);
        }
      }
    } catch {}
  });

  // Relative Seek (+/- 5 seconds)
  function seekRelative(deltaSeconds) {
    if (!hasVideo) return;
    const current = getCurrentPlaybackTime();
    const targetTime = Math.max(0, current + deltaSeconds);
    currentTime = targetTime;
    lastTimeUpdate = performance.now();
    sendYTCommand('seekTo', [targetTime, true]);
    saveToStorage();
  }

  // 1. Direct 1:1 Smooth Subpixel Scaling
  let currentWidth = 940;
  const minWidth = 440;

  window.addEventListener('wheel', (e) => {
    if (hasVideo && playerBox.matches(':hover')) {
      return;
    }
    e.preventDefault();

    const sensitivity = e.ctrlKey ? 1.8 : 0.85;
    const delta = -e.deltaY * sensitivity;
    const maxWidth = Math.min(1600, window.innerWidth * 0.94);

    currentWidth = Math.max(minWidth, Math.min(maxWidth, currentWidth + delta));
    playerBox.style.width = `${currentWidth}px`;
  }, { passive: false });

  // 2. Prevent selection on double-click & Toggle Theme
  window.addEventListener('mousedown', (e) => {
    if (e.detail > 1) {
      e.preventDefault();
    }
  });

  window.addEventListener('dblclick', (e) => {
    if (e.target.tagName !== 'IFRAME') {
      const selection = window.getSelection();
      if (selection) selection.removeAllRanges();
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try {
        localStorage.setItem(THEME_KEY, next);
      } catch {}
    }
  });

  // 3. Keep Window Focused for Instant Commands
  function reclaimFocus() {
    if (document.activeElement === video || document.activeElement !== document.body) {
      window.focus();
    }
  }

  window.addEventListener('focus', reclaimFocus);
  window.addEventListener('mouseenter', reclaimFocus);
  window.addEventListener('mousemove', () => {
    wakeCursor();
    if (!playerBox.matches(':hover') && document.activeElement === video) {
      window.focus();
    }
  }, { passive: true });

  // 4. Cursor Inactivity
  function wakeCursor() {
    if (isIdle) {
      isIdle = false;
      document.body.classList.remove('idle');
    }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      isIdle = true;
      document.body.classList.add('idle');
    }, 2000);
  }

  window.addEventListener('keydown', wakeCursor, { passive: true });
  wakeCursor();

  // 5. Link & Timestamp Parsing
  function extractId(url) {
    if (!url || typeof url !== 'string') return null;
    const match = url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|live\/))([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : (/^[a-zA-Z0-9_-]{11}$/.test(url.trim()) ? url.trim() : null);
  }

  function extractStart(url) {
    if (!url || typeof url !== 'string') return 0;
    const match = url.match(/[?&#](?:t|start)=([0-9hms]+)/i);
    if (!match) return 0;
    const t = match[1];
    if (/^\d+$/.test(t)) return parseInt(t, 10);
    let sec = 0;
    const h = t.match(/(\d+)h/i), m = t.match(/(\d+)m/i), s = t.match(/(\d+)s/i);
    if (h) sec += parseInt(h[1]) * 3600;
    if (m) sec += parseInt(m[1]) * 60;
    if (s) sec += parseInt(s[1]);
    return sec;
  }

  // 6. Playback Controller
  function play(id, time = 0) {
    hasVideo = true;
    isPlaying = true;
    currentTime = time;
    lastTimeUpdate = performance.now();
    currentVideo = { id, time };
    lastSavedSecond = -1;
    cue.classList.add('hidden');

    const roundedTime = Math.floor(time);
    const timeParam = roundedTime > 0 ? `&start=${roundedTime}` : '';
    const originParam = (window.location.origin && window.location.protocol.startsWith('http'))
      ? `&origin=${encodeURIComponent(window.location.origin)}`
      : '';

    video.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1&playsinline=1&rel=1${timeParam}${originParam}`;

    playerBox.classList.add('playing');
    document.body.classList.add('video-active');
    
    startHandshake();
    saveToStorage();
    window.focus();
  }

  function clearVideo() {
    if (!hasVideo) return;
    lastClearedVideo = { id: currentVideo.id, time: Math.floor(getCurrentPlaybackTime()) };
    hasVideo = false;
    isPlaying = false;
    currentVideo = null;
    stopHandshake();

    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch {}

    video.src = '';
    playerBox.classList.remove('playing');
    document.body.classList.remove('video-active');
    cue.classList.remove('hidden');
    window.focus();
  }

  // 7. Instant Paste (⌘V / Ctrl+V)
  window.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const id = extractId(text);
    if (id) {
      play(id, extractStart(text));
    }
  });

  // 8. Copy Current Video URL with exact timestamp (⌘C / Ctrl+C)
  function copyVideoUrl() {
    if (hasVideo && currentVideo) {
      const roundedTime = Math.floor(getCurrentPlaybackTime());
      const timeParam = roundedTime > 0 ? `?t=${roundedTime}` : '';
      const url = `https://youtu.be/${currentVideo.id}${timeParam}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
      }
    }
  }

  window.addEventListener('copy', (e) => {
    if (hasVideo && currentVideo) {
      e.preventDefault();
      const roundedTime = Math.floor(getCurrentPlaybackTime());
      const timeParam = roundedTime > 0 ? `?t=${roundedTime}` : '';
      const url = `https://youtu.be/${currentVideo.id}${timeParam}`;
      if (e.clipboardData) {
        e.clipboardData.setData('text/plain', url);
      } else {
        copyVideoUrl();
      }
    }
  });

  // 9. Instant Key Commands: Space, Arrows, ⌘C, ⌘Z, Backspace
  window.addEventListener('keydown', (e) => {
    const isCmdOrCtrl = e.metaKey || e.ctrlKey;

    if (isCmdOrCtrl && e.key.toLowerCase() === 'c') {
      copyVideoUrl();
      return;
    }

    if (isCmdOrCtrl && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      if (!hasVideo && lastClearedVideo) {
        e.preventDefault();
        play(lastClearedVideo.id, lastClearedVideo.time);
      }
      return;
    }

    if (e.code === 'Space' || e.key === ' ') {
      if (hasVideo) {
        e.preventDefault();
        if (isPlaying) {
          sendYTCommand('pauseVideo');
          currentTime = getCurrentPlaybackTime();
          lastTimeUpdate = performance.now();
          isPlaying = false;
        } else {
          sendYTCommand('playVideo');
          lastTimeUpdate = performance.now();
          isPlaying = true;
        }
        saveToStorage();
      }
      return;
    }

    if (e.key === 'ArrowLeft') {
      if (hasVideo) {
        e.preventDefault();
        seekRelative(-5);
      }
      return;
    }

    if (e.key === 'ArrowRight') {
      if (hasVideo) {
        e.preventDefault();
        seekRelative(5);
      }
      return;
    }

    if (e.key === 'Backspace' || e.key === 'Delete') {
      clearVideo();
    }
  });

  window.addEventListener('beforeunload', () => {
    saveToStorage();
  });

  // Init & Restore
  (function init() {
    try {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme) {
        html.setAttribute('data-theme', savedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    } catch {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    }

    playerBox.style.width = `${currentWidth}px`;

    // Automatically restore video after page reload
    try {
      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        const parsed = JSON.parse(savedData);
        if (parsed && parsed.id) {
          play(parsed.id, parsed.time || 0);
        }
      }
    } catch {}

    window.focus();
  })();
</script>
</body>
</html>
