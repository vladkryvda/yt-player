<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

::selection {
  background: transparent;
}

:root {
  /* Japanese Washi (Light) */
  --bg: #f4f1ea;
  --text: #2b2824;
  --faint: #8f887b;
  --video-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.16);
  --radius-video: 18px;
}

[data-theme="dark"] {
  /* Kuro-sumi / Yakisugi Charcoal (Dark) */
  --bg: #111110;
  --text: #ede8df;
  --faint: #6b6459;
  --video-shadow: 0 28px 70px -14px rgba(0, 0, 0, 0.75);
  --radius-video: 18px;
}

html, body {
  height: 100%;
  width: 100%;
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  cursor: none; /* Replaced by smooth-fading cursor */
  transition: background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
              color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* Smooth-Fading Mouse Cursor */
.custom-cursor {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 99999;
  opacity: 1;
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform, opacity;
}

.custom-cursor.idle {
  opacity: 0;
}

/* Micro-Texture Film Grain */
.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* Video Scalable Box */
.player-box {
  position: relative;
  width: 100%;
  max-width: 940px;
  aspect-ratio: 16 / 9;
  display: flex;
  align-items: center;
  justify-content: center;
  contain: layout style;
  transform: translateZ(0);
}

/* Floating Rounded Frame for Video */
.viewport {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-video);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.97);
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
              transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow 0.3s ease;
  -webkit-mask-image: -webkit-radial-gradient(white, black);
}

.player-box.playing .viewport {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
  box-shadow: var(--video-shadow);
}

/* Shield to prevent hover controls until clicked once */
.video-shield {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: transparent;
}

.video-shield.unshielded {
  pointer-events: none;
}

/* Minimal Living Breathing Cue */
.cue {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--faint);
  pointer-events: none;
  animation: breathe 3.6s ease-in-out infinite;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.cue.hidden {
  opacity: 0;
  transform: scale(0.9);
  animation: none;
}

@keyframes breathe {
  0%, 100% {
    opacity: 0.4;
    transform: scale(0.98);
  }
  50% {
    opacity: 0.85;
    transform: scale(1.02);
  }
}

/* Video Frame */
iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: var(--radius-video);
}
</style>
</head>
<body>

<!-- Smooth-fading hardware cursor -->
<svg class="custom-cursor" id="customCursor" width="20" height="20" viewBox="0 0 24 24">
  <path fill="var(--text)" stroke="var(--bg)" stroke-width="1.5" stroke-linejoin="round" d="M3 2l12 12h-6l4 8-2.5 1-4-8-3.5 3.5V2z"/>
</svg>

<!-- Tactile grain layer -->
<div class="grain"></div>

<div class="player-box" id="playerBox">
  <!-- Breathing Hotkey Cue Only -->
  <div class="cue" id="cue">⌘V</div>

  <!-- Rounded Floating Video Viewport -->
  <div class="viewport">
    <div class="video-shield" id="videoShield"></div>
    <iframe id="video" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen></iframe>
  </div>
</div>

<script>
  const html = document.documentElement;
  const playerBox = document.getElementById('playerBox');
  const video = document.getElementById('video');
  const cue = document.getElementById('cue');
  const customCursor = document.getElementById('customCursor');
  const videoShield = document.getElementById('videoShield');

  let hasVideo = false;
  let currentVideo = null;
  let lastClearedVideo = null;
  let idleTimer = null;

  // 1. Smooth Scaling Loop via requestAnimationFrame (Low CPU / 60-120fps)
  let currentWidth = 940;
  let targetWidth = 940;
  const minWidth = 440;
  let scaleRaf = null;

  function updateScaleLoop() {
    const diff = targetWidth - currentWidth;
    if (Math.abs(diff) < 0.25) {
      currentWidth = targetWidth;
      playerBox.style.maxWidth = `${Math.round(currentWidth)}px`;
      scaleRaf = null;
      return;
    }

    currentWidth += diff * 0.28;
    playerBox.style.maxWidth = `${Math.round(currentWidth)}px`;
    scaleRaf = requestAnimationFrame(updateScaleLoop);
  }

  function queueScale(delta) {
    const maxWidth = Math.min(1600, window.innerWidth * 0.94);
    targetWidth = Math.max(minWidth, Math.min(maxWidth, targetWidth + delta));
    if (!scaleRaf) {
      scaleRaf = requestAnimationFrame(updateScaleLoop);
    }
  }

  // Prevent resize when scrolling over active YouTube menus
  window.addEventListener('wheel', (e) => {
    if (hasVideo && playerBox.matches(':hover') && videoShield.classList.contains('unshielded')) {
      return;
    }
    e.preventDefault();
    const sensitivity = e.ctrlKey ? 2.5 : 0.8;
    const delta = -e.deltaY * sensitivity;
    queueScale(delta);
  }, { passive: false });

  // 2. Click once on video to activate controls; reset shield on mouse leave
  videoShield.addEventListener('click', () => {
    videoShield.classList.add('unshielded');
  });

  playerBox.addEventListener('mouseleave', () => {
    videoShield.classList.remove('unshielded');
  });

  // 3. Prevent Text Selection on Double Click & Double-Click Theme Toggle
  window.addEventListener('mousedown', (e) => {
    if (e.detail > 1) {
      e.preventDefault(); // Prevents selection highlighting on rapid clicks
    }
  });

  window.addEventListener('dblclick', (e) => {
    e.preventDefault();
    window.getSelection()?.removeAllRanges();
    if (e.target.tagName !== 'IFRAME') {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
    }
  });

  // 4. Smooth Mouse Fade-Out on Inactivity
  function wakeCursor(e) {
    customCursor.classList.remove('idle');
    if (e && e.clientX !== undefined) {
      customCursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
    }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      customCursor.classList.add('idle');
    }, 2000);
  }

  window.addEventListener('mousemove', (e) => {
    wakeCursor(e);
    if (!playerBox.matches(':hover') && document.activeElement === video) {
      window.focus();
    }
  }, { passive: true });

  window.addEventListener('keydown', wakeCursor, { passive: true });
  wakeCursor();

  // 5. Keep Window Focused for Instant Commands
  function reclaimFocus() {
    if (document.activeElement === video || document.activeElement !== document.body) {
      window.focus();
    }
  }

  window.addEventListener('focus', reclaimFocus);
  window.addEventListener('mouseenter', reclaimFocus);

  // 6. Link & Timestamp Parsing
  function extractId(url) {
    if (!url || typeof url !== 'string') return null;
    const match = url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|live\/))([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : (/^[a-zA-Z0-9_-]{11}$/.test(url.trim()) ? url.trim() : null);
  }

  function extractStart(url) {
    if (!url || typeof url !== 'string') return 0;
    const match = url.match(/[?&#](?:t|start)=([0-9hms]+)/i);
    if (!match) return 0;
    const t = match[1];
    if (/^\d+$/.test(t)) return parseInt(t, 10);
    let sec = 0;
    const h = t.match(/(\d+)h/i), m = t.match(/(\d+)m/i), s = t.match(/(\d+)s/i);
    if (h) sec += parseInt(h[1]) * 3600;
    if (m) sec += parseInt(m[1]) * 60;
    if (s) sec += parseInt(s[1]);
    return sec;
  }

  // 7. Playback Controller
  function play(id, time = 0) {
    hasVideo = true;
    currentVideo = { id, time };
    cue.classList.add('hidden');
    videoShield.classList.remove('unshielded');

    const timeParam = time ? `&start=${time}` : '';
    video.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=1${timeParam}`;

    playerBox.classList.add('playing');
    window.focus();
  }

  function clearVideo() {
    if (!hasVideo) return;
    lastClearedVideo = { ...currentVideo };
    hasVideo = false;
    currentVideo = null;
    video.src = '';
    videoShield.classList.remove('unshielded');
    playerBox.classList.remove('playing');
    cue.classList.remove('hidden');
    window.focus();
  }

  // 8. Instant Paste (⌘V / Ctrl+V)
  window.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const id = extractId(text);
    if (id) {
      play(id, extractStart(text));
    }
  });

  // 9. Instant Wipe (Backspace / Delete / Esc) & Undo (⌘Z)
  window.addEventListener('keydown', (e) => {
    const isCmdOrCtrl = e.metaKey || e.ctrlKey;

    if (isCmdOrCtrl && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      if (!hasVideo && lastClearedVideo) {
        e.preventDefault();
        play(lastClearedVideo.id, lastClearedVideo.time);
      }
      return;
    }

    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape') {
      clearVideo();
    }
  });

  // Init
  (function init() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    playerBox.style.maxWidth = `${currentWidth}px`;
    window.focus();
  })();
</script>
</body>
</html>
