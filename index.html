<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --border: #e4e4e7;
  --border-focus: #18181b;
  --text: #18181b;
  --muted: #71717a;
  --faint: #a1a1aa;
  --ok: #10b981;
  --err: #ef4444;
  --radius: 6px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] {
  --bg: #09090b;
  --surface: #121214;
  --border: #27272a;
  --border-focus: #fafafa;
  --text: #fafafa;
  --muted: #a1a1aa;
  --faint: #52525b;
  --ok: #34d399;
  --err: #f87171;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

/* Dimming in focus mode */
.dimmable {
  transition: opacity 0.5s ease;
}
body.cinema-dim .dimmable {
  opacity: 0.05;
  pointer-events: none;
}

/* Minimal Top Bar */
.top-bar {
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 20;
}

.theme-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s, color 0.15s;
}

.theme-btn:hover {
  color: var(--text);
  border-color: var(--border-focus);
}

.theme-btn svg {
  width: 13px;
  height: 13px;
}

/* Layout */
.container {
  width: 100%;
  max-width: 820px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Input Area */
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  transition: border-color 0.15s;
}

.input-wrap:focus-within {
  border-color: var(--border-focus);
}

.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  margin-left: 14px;
  background: transparent;
  transition: background-color 0.2s ease;
  flex-shrink: 0;
}

.status-dot.ok { background: var(--ok); }
.status-dot.err { background: var(--err); }

input {
  width: 100%;
  height: 40px;
  border: none;
  outline: none;
  background: transparent;
  padding: 0 40px 0 10px;
  font-family: 'Geist Mono', monospace;
  font-size: 13px;
  color: var(--text);
}

input::placeholder {
  color: var(--faint);
}

.clear-btn {
  position: absolute;
  right: 8px;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  width: 26px;
  height: 26px;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
}

.clear-btn.visible { display: flex; }
.clear-btn:hover { color: var(--text); }
.clear-btn svg { width: 10px; height: 10px; }

/* Video Title Bar */
.video-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 16px;
  padding: 0 2px;
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}

.video-title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 85%;
}

/* Player Frame */
.player-container {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  position: relative;
  overflow: hidden;
}

.placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--faint);
  pointer-events: none;
  transition: opacity 0.2s;
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.placeholder.hidden { opacity: 0; }

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  transition: opacity 0.25s ease;
}

iframe.active { opacity: 1; }

/* Quick Notes (Per Video) */
.notes {
  width: 100%;
  height: 52px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  line-height: 1.5;
  padding: 8px 12px;
  resize: vertical;
  min-height: 42px;
  max-height: 160px;
  outline: none;
  transition: border-color 0.15s;
}

.notes:focus {
  border-color: var(--border-focus);
}

.notes::placeholder {
  color: var(--faint);
}

/* Minimal History Breadcrumbs */
.history-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  padding: 2px 0;
}
.history-bar::-webkit-scrollbar { display: none; }

.history-label {
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  color: var(--faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.history-item {
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  cursor: pointer;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: border-color 0.15s, color 0.15s;
}

.history-item:hover {
  border-color: var(--border-focus);
  color: var(--text);
}
</style>
</head>
<body>

<div class="top-bar dimmable">
  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
    <svg id="themeIcon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
      <path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/>
    </svg>
  </button>
</div>

<div class="container">
  <div class="input-wrap dimmable">
    <div class="status-dot" id="dot"></div>
    <input id="inp" type="text" placeholder="Paste link or press / to search..." autocomplete="off" spellcheck="false">
    <button class="clear-btn" id="clr" title="Clear">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="2" y1="2" x2="10" y2="10"/>
        <line x1="10" y1="2" x2="2" y2="10"/>
      </svg>
    </button>
  </div>

  <div class="video-meta dimmable">
    <span class="video-title" id="videoTitle"></span>
  </div>

  <div class="player-container">
    <div class="placeholder" id="ph">paste youtube link to play</div>
    <iframe id="frame" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>
  </div>

  <textarea id="notes" class="notes dimmable" placeholder="Video notes (auto-saved per video)..." autocomplete="off" spellcheck="false"></textarea>

  <div class="history-bar dimmable" id="historyBar">
    <span class="history-label">Recent:</span>
    <div id="historyList" style="display:inline-flex; gap:6px;"></div>
  </div>
</div>

<script>
  function safeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function safeGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

  // Theme Sync
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const themeIcon = document.getElementById('themeIcon');

  function updateThemeUI(theme) {
    html.setAttribute('data-theme', theme);
    themeIcon.innerHTML = theme === 'dark' 
      ? `<circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/>`
      : `<path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/>`;
  }

  themeBtn.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    safeSet('player-theme', next);
    updateThemeUI(next);
  });

  const inp = document.getElementById('inp');
  const clr = document.getElementById('clr');
  const dot = document.getElementById('dot');
  const frame = document.getElementById('frame');
  const ph = document.getElementById('ph');
  const notes = document.getElementById('notes');
  const videoTitle = document.getElementById('videoTitle');
  const historyList = document.getElementById('historyList');

  let activeVideoId = null;
  let historyQueue = safeGet('yt-history') || [];

  // Timestamp parser: handles 120, 2m15s, 1h2m3s
  function extractTimestamp(url) {
    try {
      const parsed = new URL(url.startsWith('http') ? url : `https://${url}`);
      const t = parsed.searchParams.get('t') || parsed.searchParams.get('start');
      if (!t) return null;
      if (/^\d+$/.test(t)) return parseInt(t, 10);

      let total = 0;
      const h = t.match(/(\d+)h/);
      const m = t.match(/(\d+)m/);
      const s = t.match(/(\d+)s/);
      if (h) total += parseInt(h[1], 10) * 3600;
      if (m) total += parseInt(m[1], 10) * 60;
      if (s) total += parseInt(s[1], 10);
      return total > 0 ? total : null;
    } catch {
      return null;
    }
  }

  function extractVideoId(url) {
    if (!url) return null;
    const str = url.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
    const m = str.match(/(?:[?&]v=|youtu\.be\/|\/(?:shorts|embed|live)\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  // Fetch title without API key (oEmbed)
  function fetchVideoTitle(id) {
    videoTitle.textContent = '';
    fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`)
      .then(res => res.json())
      .then(data => {
        if (data.title && activeVideoId === id) {
          videoTitle.textContent = data.title;
          updateHistoryTitle(id, data.title);
        }
      })
      .catch(() => {});
  }

  function renderHistory() {
    historyList.innerHTML = '';
    historyQueue.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'history-item';
      btn.textContent = item.title || item.id;
      btn.title = item.title || item.id;
      btn.onclick = () => {
        inp.value = `https://youtu.be/${item.id}`;
        processInput();
      };
      historyList.appendChild(btn);
    });
  }

  function addToHistory(id) {
    historyQueue = historyQueue.filter(x => x.id !== id);
    historyQueue.unshift({ id, title: '' });
    if (historyQueue.length > 5) historyQueue.pop();
    safeSet('yt-history', historyQueue);
    renderHistory();
  }

  function updateHistoryTitle(id, title) {
    const item = historyQueue.find(x => x.id === id);
    if (item) {
      item.title = title;
      safeSet('yt-history', historyQueue);
      renderHistory();
    }
  }

  function setVideo(id, timestamp) {
    if (activeVideoId === id && !timestamp) return;
    activeVideoId = id;

    dot.className = 'status-dot ok';
    ph.classList.add('hidden');
    frame.classList.add('active');

    // Load per-video notes
    const savedNote = safeGet(`note-${id}`) || '';
    notes.value = savedNote;
    notes.placeholder = `Notes for ${id}...`;

    // rel=1 for global platform recommendations, optional start timestamp
    const timeParam = timestamp ? `&start=${timestamp}` : '';
    frame.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1&rel=1${timeParam}`;

    fetchVideoTitle(id);
    addToHistory(id);
  }

  function clearVideo() {
    activeVideoId = null;
    frame.src = '';
    frame.classList.remove('active');
    ph.classList.remove('hidden');
    videoTitle.textContent = '';
    notes.value = '';
    notes.placeholder = 'Video notes (auto-saved per video)...';
  }

  function processInput() {
    const val = inp.value;
    clr.classList.toggle('visible', val.length > 0);
    const id = extractVideoId(val);
    const time = extractTimestamp(val);

    if (id) {
      setVideo(id, time);
      safeSet('last-link', val);
    } else {
      dot.className = val.trim() ? 'status-dot err' : 'status-dot';
      if (!val.trim()) {
        clearVideo();
        safeSet('last-link', '');
      }
    }
  }

  inp.addEventListener('input', processInput);

  function resetInput() {
    inp.value = '';
    clr.classList.remove('visible');
    dot.className = 'status-dot';
    clearVideo();
    safeSet('last-link', '');
    inp.focus();
  }

  clr.addEventListener('click', resetInput);

  // Per-video note auto-save
  let noteTimer = null;
  notes.addEventListener('input', () => {
    if (!activeVideoId) return;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      safeSet(`note-${activeVideoId}`, notes.value);
    }, 300);
  });

  // Global Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    const isEditing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);

    if (e.key === '/' && !isEditing) {
      e.preventDefault();
      inp.focus();
    }
    if (e.key === 'Escape') {
      if (document.activeElement === inp) resetInput();
      else document.activeElement?.blur();
    }
  });

  // Global Clipboard Paste
  window.addEventListener('paste', (e) => {
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
    const text = (e.clipboardData || window.clipboardData)?.getData('text');
    if (text && extractVideoId(text)) {
      inp.value = text.trim();
      processInput();
    }
  });

  // Inactivity Dimming Mode
  let idleTimer = null;
  function resetInactivityTimer() {
    document.body.classList.remove('cinema-dim');
    clearTimeout(idleTimer);
    if (activeVideoId) {
      idleTimer = setTimeout(() => {
        const isEditing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
        if (!isEditing) {
          document.body.classList.add('cinema-dim');
        }
      }, 3500);
    }
  }

  window.addEventListener('mousemove', resetInactivityTimer, { passive: true });
  window.addEventListener('keydown', resetInactivityTimer, { passive: true });

  // Init
  (function init() {
    const savedTheme = safeGet('player-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    updateThemeUI(savedTheme);
    renderHistory();

    const lastLink = safeGet('last-link');
    if (lastLink) {
      inp.value = lastLink;
      processInput();
    }
  })();
</script>
</body>
</html>
